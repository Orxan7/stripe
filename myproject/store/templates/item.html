{% extends "base.html" %}
{% load static %}
{% block title %}Item Page{% endblock %}
{% block links %}
    <link rel="stylesheet" href="{% static 'css/item.css' %}">
{% endblock %}
{% block content %}
    <div class="card">
        <div class="name">{{ item_name }}</div>
        <p>{{ item_description }}</p>
        <div class="price">{{ item_price }}</div>
        <button id="buyBtn" type="button" onclick="redirectToCheckout('{% url 'store:buy' item_id=item_id %}', '{{ item_id }}', '{{ stripe_public_key }}')">Buy</button>
    </div>
    <script src="https://js.stripe.com/v3/"></script>
    <script src="{% static 'js/item.js' %}"></script>
{% endblock %}
